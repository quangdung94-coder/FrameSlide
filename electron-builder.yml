appId: local.frameslide.app
productName: FrameSlide
directories:
  output: release
files:
  - out/**/*
  - package.json
  - "!**/node_modules/three/**/*"
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
